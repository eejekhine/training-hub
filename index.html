<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Training Hub</title>
<meta name="theme-color" content="#b8611f">
<script src="hub-core.js"></script>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training Hub">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,450;9..144,550;9..144,650&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#f6f3ec; --surface:#ffffff; --surface-2:#f0ece1; --line:#e2dbc8;
    --ink:#221d16; --ink-dim:#675e4c; --ink-faint:#9a917a;
    --copper:#b8611f; --copper-ink:#8f4a17;
    --good:#2f7a44; --good-tint:#e9f3ec;
    --gold:#8a6a12; --gold-tint:#f7f0dc;
    --crit:#a83f2f; --crit-tint:#f8ebe6;
    --body-c:#3a6ea5; --body-tint:#e8eff8;
    --study-c:#6a4c93; --study-tint:#efe9f5;
    --life-c:#8a6a12; --life-tint:#f7f0dc;
    --shadow:0 1px 2px rgba(30,22,10,.07);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ground:#14161b; --surface:#1a1d24; --surface-2:#20232b; --line:#2c313a;
      --ink:#edeff2; --ink-dim:#9aa1ad; --ink-faint:#666d79;
      --copper:#dd9451; --copper-ink:#eaad76;
      --good:#68b77c; --good-tint:#1b2a20;
      --gold:#d9b448; --gold-tint:#2b2617;
      --crit:#df8272; --crit-tint:#2e1d1b;
      --body-c:#7ea7d8; --body-tint:#1a2632;
      --study-c:#b19cd9; --study-tint:#241f2e;
      --life-c:#d9b448; --life-tint:#2b2617;
      --shadow:0 1px 2px rgba(0,0,0,.4);
      color-scheme: dark;
    }
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0;min-height:100%}
  body{background:var(--ground);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:15.5px;line-height:1.6;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-tap-highlight-color:transparent}
  .mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace}
  h1,h2{font-family:'Fraunces',Georgia,serif;color:var(--ink);text-wrap:balance;margin:0}
  a{color:inherit}
  .wrap{max-width:720px;margin:0 auto;padding-inline:20px}

  .topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb, var(--ground) 92%, transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .topbar-row{display:flex;align-items:center;gap:14px;padding-block:14px}
  .brand{font-family:'Fraunces',serif;font-weight:650;font-size:18px;color:var(--copper);letter-spacing:.01em;white-space:nowrap}
  .search{margin-left:auto;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink);width:100%;max-width:220px}
  .search::placeholder{color:var(--ink-faint)}
  .gear{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;font-size:17px;flex-shrink:0}
  .lockmark{font-size:11px;margin-left:6px;opacity:.8}

  .hero{padding-block:30px 20px}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--copper-ink);margin-bottom:8px}
  .hero h1{font-size:clamp(1.6rem,4vw,2.1rem);font-weight:650;line-height:1.1}
  .hero p{color:var(--ink-dim);max-width:56ch;margin-top:10px;font-size:14px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;padding-block:8px 50px}
  .tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);text-decoration:none;transition:transform .12s ease,border-color .12s ease}
  .tile:hover{transform:translateY(-2px);border-color:var(--copper)}
  .tile.pinned{border-color:var(--copper);border-width:1.5px}
  .tile-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .tile-name{font-size:15px;font-weight:600;color:var(--ink);line-height:1.3}
  .tile-desc{font-size:12.5px;color:var(--ink-dim);line-height:1.5;flex:1}
  .tile-meta{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em}
  .pin-star{color:var(--copper);font-size:13px}

  .cat{display:inline-flex;align-items:center;gap:5px;font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:20px;white-space:nowrap}
  .cat.body{background:var(--body-tint);color:var(--body-c)}
  .cat.study{background:var(--study-tint);color:var(--study-c)}
  .cat.life{background:var(--life-tint);color:var(--life-c)}
  .cat.overview{background:var(--crit-tint);color:var(--crit)}

  .empty{color:var(--ink-faint);font-size:13px;padding:30px 0;text-align:center}

  footer{padding:20px 0 50px;color:var(--ink-faint);font-size:11px;font-family:'IBM Plex Mono',monospace;text-align:center}

  @media (max-width:480px){
    .search{max-width:140px}
    .grid{grid-template-columns:1fr 1fr}
  }
  @media (max-width:380px){
    .grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="wrap topbar-row">
    <span class="brand">Training Hub</span>
    <input class="search" id="search" type="text" placeholder="Search tools…">
    <a class="gear" href="settings.html" aria-label="Settings">⚙</a>
  </div>
</div>

<div class="wrap">
  <header class="hero">
    <div class="eyebrow">Ethan's app library</div>
    <h1>Everything you've built, one screen.</h1>
    <p>The Dashboard, training, and life admin — all in one place instead of a folder of filenames.</p>
  </header>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>No tools match that search.</div>
</div>

<footer>Training Hub · <a href="settings.html" style="text-decoration:none">Settings</a></footer>

<script>
  var TOOLS = [];

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  function tileHtml(tool) {
    var pinned = tool.pinned ? ' pinned' : '';
    var star = tool.pinned ? '<span class="pin-star">★</span>' : '';
    var target = tool.external ? ' target="_blank" rel="noopener"' : '';
    var meta = tool.external ? 'Opens on claude.ai' : (tool.meta || 'Tap to open');
    var lockedMark = (window.HubCore && HubCore.lock.isToolLocked(tool.id)) ? '<span class="lockmark" title="Locked">🔒</span>' : '';
    return '<a class="tile' + pinned + '" data-tool="' + tool.id + '" href="' + tool.href + '"' + target + '>' +
      '<div class="tile-top"><span class="cat ' + tool.category + '">' + tool.category + '</span>' + star + '</div>' +
      '<div class="tile-name">' + escapeHtml(tool.name) + lockedMark + '</div>' +
      '<div class="tile-desc">' + escapeHtml(tool.desc || '') + '</div>' +
      '<div class="tile-meta">' + meta + '</div>' +
      '</a>';
  }

  function render(filter) {
    var grid = document.getElementById('grid');
    var empty = document.getElementById('empty');
    var q = (filter || '').trim().toLowerCase();
    var list = TOOLS.filter(function (t) {
      return !q || t.name.toLowerCase().indexOf(q) > -1 || t.category.toLowerCase().indexOf(q) > -1;
    });
    // pinned first, then original order
    list.sort(function (a, b) { return (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0); });
    grid.innerHTML = list.map(tileHtml).join('');
    empty.hidden = list.length > 0;
  }

  fetch('tools.json').then(function (r) { return r.json(); }).then(function (data) {
    TOOLS = data;
    render('');
  }).catch(function (err) {
    console.error('Could not load tools.json', err);
    document.getElementById('empty').hidden = false;
    document.getElementById('empty').textContent = 'Could not load tools.json.';
  });

  document.getElementById('search').addEventListener('input', function (e) {
    render(e.target.value);
  });

  // locked tools ask for the PIN before opening
  document.getElementById('grid').addEventListener('click', function (e) {
    var a = e.target.closest('a.tile');
    if (!a || !window.HubCore) return;
    var id = a.getAttribute('data-tool');
    if (!HubCore.lock.isToolLocked(id) || HubCore.lock.isUnlocked()) return;
    e.preventDefault();
    HubCore.lock.request(id).then(function (ok) {
      if (!ok) return;
      if (a.target === '_blank') { HubCore.toast('Unlocked — tap ' + (a.querySelector('.tile-name').textContent.replace('🔒', '').trim()) + ' again to open'); }
      else { location.href = a.getAttribute('href'); }
    });
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
