<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>VERT LAB</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0d0d0d;--bg2:#161616;--bg3:#1e1e1e;--border:#252525;--border2:#303030;--text:#f0f0f0;--muted:#666;--muted2:#444;--gold:#e2b96b;--green:#52d98a;--red:#e05a5a;--blue:#5a9fe0;--purple:#9a5ae0;--orange:#e07a3a;--teal:#3ab8c8}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;min-height:100vh}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

.header{background:linear-gradient(180deg,#0a0a0a,#111);border-bottom:1px solid var(--border);padding:28px 20px 20px;position:sticky;top:0;z-index:100}
.header-inner{max-width:620px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-end}
.eyebrow{font-size:10px;letter-spacing:4px;color:var(--gold);font-weight:700;margin-bottom:2px}
.logo{font-family:'Bebas Neue',sans-serif;font-size:58px;line-height:.9;letter-spacing:3px;background:linear-gradient(135deg,#fff,var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header-sub{font-size:12px;color:var(--muted);letter-spacing:1px;text-align:right}

.screen{display:none;max-width:620px;margin:0 auto;padding:28px 20px 80px}
.screen.active{display:block}
.slabel{font-size:10px;letter-spacing:4px;color:var(--muted2);margin-bottom:22px;font-weight:700}

.back-btn{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;padding:0 0 22px;display:flex;align-items:center;gap:6px;font-family:'Barlow',sans-serif;font-weight:600;letter-spacing:.5px;transition:color .15s}
.back-btn:hover{color:var(--text)}

/* Duration grid */
.dur-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px}
.dur-btn{border:1px solid var(--border);border-radius:14px;padding:20px 10px 16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--bg2);transition:transform .15s,border-color .15s,box-shadow .15s}
.dur-btn:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(0,0,0,.5);border-color:var(--border2)}
.dur-btn.gym{background:linear-gradient(145deg,#111120,#181828);border-color:#e2b96b22}
.dur-btn.gym:hover{border-color:var(--gold)}
.dur-num{font-family:'Bebas Neue',sans-serif;font-size:46px;line-height:1;color:#fff}
.dur-btn.gym .dur-num{color:var(--gold)}
.dur-unit{font-size:10px;letter-spacing:3px;color:var(--muted);font-weight:700}
.dur-loc{margin-top:8px;font-size:11px;padding:3px 10px;border-radius:20px;font-weight:600}
.dur-btn:not(.gym) .dur-loc{background:#ffffff0d;color:#888}
.dur-btn.gym .dur-loc{background:#e2b96b15;color:var(--gold)}
.legend{display:flex;gap:20px;flex-wrap:wrap}
.leg-i{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
.leg-dot{width:7px;height:7px;border-radius:50%;display:inline-block}

/* Focus grid */
.focus-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.focus-btn{border-radius:12px;padding:16px 14px;cursor:pointer;border:1px solid transparent;transition:transform .12s;text-align:left}
.focus-btn:hover{transform:translateY(-2px)}
.f-icon{font-size:24px;margin-bottom:8px;display:block}
.f-name{font-family:'Barlow',sans-serif;font-size:17px;font-weight:700;letter-spacing:.3px;display:block}
.f-desc{font-size:11px;margin-top:3px;opacity:.7;display:block;line-height:1.4}

/* Session card */
.sess-card{border-radius:14px;padding:22px 20px;cursor:pointer;border:1px solid var(--border);background:var(--bg2);transition:transform .15s,box-shadow .15s;position:relative;overflow:hidden;margin-bottom:12px}
.sess-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.sess-card:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.sess-card.gym{background:linear-gradient(135deg,#101020,#181828);border-color:#e2b96b22}
.sess-tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:4px 10px;border-radius:20px;font-weight:700;margin-bottom:10px;letter-spacing:.5px}
.sess-title{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:1px;margin-bottom:4px;line-height:1}
.sess-meta{font-size:13px;color:var(--muted);margin-bottom:14px}
.sess-pills{display:flex;flex-wrap:wrap;gap:6px}
.sess-pill{font-size:10px;padding:3px 9px;border-radius:20px;background:var(--border);color:var(--muted);font-weight:600;letter-spacing:.5px}
.sess-arrow{position:absolute;right:18px;bottom:18px;font-size:11px;color:var(--muted2);letter-spacing:2px;font-weight:700}

/* Workout */
.w-header{margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--border)}
.w-title{font-family:'Bebas Neue',sans-serif;font-size:40px;letter-spacing:1px;margin-bottom:4px;line-height:1}
.w-meta{font-size:13px;color:var(--muted);margin-bottom:12px}
.prog-wrap{background:var(--border);border-radius:4px;height:4px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--gold),#f0c97a);border-radius:4px;transition:width .4s ease;width:0%}
.prog-text{font-size:11px;color:var(--muted);margin-top:6px;letter-spacing:1px}

.tip-box{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.tip-title{font-size:11px;font-weight:700;color:var(--gold);margin-bottom:4px;letter-spacing:1px}
.tip-body{font-size:13px;color:var(--muted);line-height:1.6}

/* Blocks */
.block-list{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.block{border-radius:12px;overflow:hidden;border:1px solid var(--border);background:var(--bg2)}
.block-hdr{width:100%;background:none;border:none;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;color:var(--text);font-family:'Barlow',sans-serif;text-align:left;transition:background .15s}
.block-hdr:hover{background:var(--bg3)}
.block-left{display:flex;align-items:center;gap:12px}
.block-num{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--border2);min-width:26px;line-height:1}
.block-name{font-size:15px;font-weight:700}
.block-dur{font-size:11px;color:var(--muted);margin-top:1px}
.block-chev{font-size:10px;color:var(--muted2);transition:transform .2s}
.block.open .block-chev{transform:rotate(180deg)}
.block-body{display:none;padding:2px 16px 14px 54px;border-top:1px solid var(--border)}
.block.open .block-body{display:block}

/* Exercises */
.ex-list{display:flex;flex-direction:column}
.ex-item{display:flex;align-items:flex-start;gap:12px;padding:11px 4px;border-bottom:1px solid var(--border);cursor:pointer;border-radius:6px;transition:background .1s}
.ex-item:last-child{border-bottom:none}
.ex-item:hover{background:var(--bg3)}
.ex-check{width:20px;height:20px;border-radius:5px;border:2px solid var(--border2);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.ex-item.done .ex-check{background:var(--green);border-color:var(--green)}
.ex-item.done .ex-check::after{content:'✓';font-size:11px;color:#000;font-weight:900}
.ex-item.done .ex-name{text-decoration:line-through;color:var(--muted)}
.ex-item.done .ex-detail{opacity:.35}
.ex-content{flex:1;min-width:0}
.ex-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ex-name{font-size:14px;font-weight:700;color:var(--text)}
.ex-detail{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5}
.viz-btn{background:none;border:1px solid var(--border2);color:var(--gold);font-size:9px;padding:3px 8px;border-radius:5px;cursor:pointer;white-space:nowrap;font-family:'Barlow',sans-serif;font-weight:700;letter-spacing:1px;flex-shrink:0;transition:background .12s}
.viz-btn:hover{background:var(--bg3)}
.viz-wrap{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 6px 4px;margin-top:8px}

/* Done banner */
.done-banner{background:linear-gradient(135deg,#121e12,#182018);border:1px solid #2a5a2a;border-radius:14px;padding:24px 20px;text-align:center;display:none;margin-top:8px}
.done-banner.show{display:block}
.done-emoji{font-size:36px;margin-bottom:8px}
.done-title{font-family:'Bebas Neue',sans-serif;font-size:34px;color:var(--green);letter-spacing:2px}
.done-sub{font-size:13px;color:#4a8a4a;margin-top:4px}

@media(max-width:480px){.logo{font-size:44px}.dur-num{font-size:38px}.focus-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div>
      <div class="eyebrow">Grab Rim by June</div>
      <div class="logo">VERT LAB</div>
    </div>
    <div class="header-sub">Pick time.<br>Do work.</div>
  </div>
</div>

<div class="screen active" id="s-dur">
  <div class="slabel">How much time do you have?</div>
  <div class="dur-grid">
    <button class="dur-btn" onclick="pickDur(15)"><span class="dur-num">15</span><span class="dur-unit">MIN</span><span class="dur-loc">🏠 Home</span></button>
    <button class="dur-btn" onclick="pickDur(30)"><span class="dur-num">30</span><span class="dur-unit">MIN</span><span class="dur-loc">🏠 Home</span></button>
    <button class="dur-btn" onclick="pickDur(45)"><span class="dur-num">45</span><span class="dur-unit">MIN</span><span class="dur-loc">🏠 Home</span></button>
    <button class="dur-btn gym" onclick="pickDur(60)"><span class="dur-num">60</span><span class="dur-unit">MIN</span><span class="dur-loc">🏋️ Gym</span></button>
    <button class="dur-btn gym" onclick="pickDur(75)"><span class="dur-num">75</span><span class="dur-unit">MIN</span><span class="dur-loc">🏋️ Gym</span></button>
    <button class="dur-btn gym" onclick="pickDur(90)"><span class="dur-num">90</span><span class="dur-unit">MIN</span><span class="dur-loc">🏋️ Gym</span></button>
  </div>
  <div class="legend">
    <div class="leg-i"><div class="leg-dot" style="background:#555"></div>Home — no equipment</div>
    <div class="leg-i"><div class="leg-dot" style="background:var(--gold)"></div>Gym — equipment required</div>
  </div>
</div>

<div class="screen" id="s-focus">
  <button class="back-btn" onclick="goTo('s-dur')">← Back</button>
  <div class="slabel">What's your focus today?</div>
  <div class="focus-grid" id="focus-grid"></div>
</div>

<div class="screen" id="s-sess">
  <button class="back-btn" onclick="goTo('s-focus')">← Back</button>
  <div class="slabel" id="sess-label">Choose your session</div>
  <div id="sess-list"></div>
</div>

<div class="screen" id="s-workout">
  <button class="back-btn" onclick="goTo('s-sess')">← Back to sessions</button>
  <div class="w-header">
    <div class="w-title" id="w-title"></div>
    <div class="w-meta" id="w-meta"></div>
    <div class="prog-wrap"><div class="prog-fill" id="prog-fill"></div></div>
    <div class="prog-text" id="prog-text">0 of 0 done</div>
  </div>
  <div class="tip-box" id="tip-box" style="display:none">
    <div class="tip-title">💡 TIP</div>
    <div class="tip-body" id="tip-body"></div>
  </div>
  <div class="block-list" id="block-list"></div>
  <div class="done-banner" id="done-banner">
    <div class="done-emoji">🏀</div>
    <div class="done-title">SESSION DONE</div>
    <div class="done-sub">Rim's getting closer. Rest up and come back tomorrow.</div>
  </div>
</div>

// ── Navigation ──
function goTo(id) {
  document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

// ── Duration pick ──
function pickDur(d) {
  cur.dur = d; cur.focus = null; cur.sessKey = null; cur.checks = {};
  renderFocus();
  goTo('s-focus');
}

function renderFocus() {
  var opts = FOCUSES[cur.dur] || [];
  document.getElementById('focus-grid').innerHTML = opts.map(function(f){
    return '<button class="focus-btn" onclick="pickFocus(\''+f.id+'\')" style="background:'+f.bg+';border-color:'+f.color+'33">'
      +'<span class="f-icon">'+f.icon+'</span>'
      +'<span class="f-name" style="color:'+f.color+'">'+f.label+'</span>'
      +'<span class="f-desc">'+f.desc+'</span>'
      +'</button>';
  }).join('');
}

// ── Focus pick ──
function pickFocus(fid) {
  cur.focus = fid;
  renderSess();
  goTo('s-sess');
}

// ── Render sessions ──
function renderSess() {
  var key = cur.dur+'-'+cur.focus;
  var s = SESS[key];
  document.getElementById('sess-label').textContent = cur.dur+' MIN — YOUR SESSION';
  var gym = cur.dur >= 60;
  if (!s) {
    document.getElementById('sess-list').innerHTML = '<p style="color:var(--muted);padding:20px 0">Session coming soon.</p>';
    return;
  }
  var acc = s.accent || 'var(--gold)';
  document.getElementById('sess-list').innerHTML =
    '<div class="sess-card'+(gym?' gym':'')+'" onclick="pickSess(\''+key+'\')" style="--acc:'+acc+'">'
    +'<style>.sess-card::before{background:'+acc+'}</style>'
    +'<div class="sess-tag" style="background:'+acc+'20;color:'+acc+';border:1px solid '+acc+'44">'+(gym?'🏋️ Gym':'🏠 Home')+'</div>'
    +'<div class="sess-title">'+s.title+'</div>'
    +'<div class="sess-meta">'+s.meta+'</div>'
    +'<div class="sess-pills">'+s.blocks.map(function(b){return '<span class="sess-pill">'+b.name+'</span>';}).join('')+'</div>'
    +'<div class="sess-arrow">START →</div>'
    +'</div>';
}

// ── Pick session & render workout ──
function pickSess(key) {
  cur.sessKey = key; cur.checks = {};
  var s = SESS[key];
  if (!s) return;
  document.getElementById('w-title').textContent = s.title;
  document.getElementById('w-meta').textContent = s.meta;
  var tb = document.getElementById('tip-box');
  if (s.tip) { tb.style.display='block'; document.getElementById('tip-body').textContent=s.tip; }
  else { tb.style.display='none'; }
  document.getElementById('done-banner').classList.remove('show');
  var bl = document.getElementById('block-list');
  bl.innerHTML = s.blocks.map(function(block, bi){
    var exHTML = block.exs.map(function(ex, ei){
      var k = bi+'-'+ei;
      var vb = (block.stretch || ex.viz) && VIZS[ex.name]
        ? '<button class="viz-btn" onclick="toggleViz(\''+k+'\',event)" id="vb-'+k+'">SHOW</button>'
        : '';
      return '<div class="ex-item" onclick="toggleCheck(\''+k+'\',event)" id="ei-'+k+'">'
        +'<div class="ex-check" id="ec-'+k+'"></div>'
        +'<div class="ex-content">'
        +'<div class="ex-top"><div class="ex-name">'+ex.name+'</div>'+vb+'</div>'
        +'<div class="ex-detail">'+ex.detail+'</div>'
        +'<div id="ev-'+k+'" style="display:none" class="viz-wrap">'+(VIZS[ex.name]||'')+'</div>'
        +'</div></div>';
    }).join('');
    return '<div class="block" id="blk-'+bi+'">'
      +'<button class="block-hdr" onclick="togBlk('+bi+')">'
      +'<div class="block-left"><div class="block-num">'+String(bi+1).padStart(2,'0')+'</div>'
      +'<div><div class="block-name">'+block.name+'</div>'
      +'<div class="block-dur">'+block.dur+(block.stretch?' · tap exercise to see visual':'')+'</div></div></div>'
      +'<div class="block-chev">▼</div></button>'
      +'<div class="block-body"><div class="ex-list">'+exHTML+'</div></div>'
      +'</div>';
  }).join('');
  setTimeout(function(){ togBlk(0, true); }, 30);
  updateProg();
  goTo('s-workout');
}

function togBlk(i, forceOpen) {
  var el = document.getElementById('blk-'+i);
  if (!el) return;
  if (forceOpen) el.classList.add('open');
  else el.classList.toggle('open');
}

function toggleCheck(k, e) {
  if (e.target.closest('.viz-btn') || e.target.closest('.viz-wrap')) return;
  e.stopPropagation();
  cur.checks[k] = !cur.checks[k];
  var item = document.getElementById('ei-'+k);
  if (item) item.classList.toggle('done', !!cur.checks[k]);
  updateProg();
}

function toggleViz(k, e) {
  e.stopPropagation();
  var v = document.getElementById('ev-'+k);
  var b = document.getElementById('vb-'+k);
  if (!v) return;
  var showing = v.style.display !== 'none';
  v.style.display = showing ? 'none' : 'block';
  if (b) b.textContent = showing ? 'SHOW' : 'HIDE';
}

function updateProg() {
  var s = SESS[cur.sessKey];
  if (!s) return;
  var total=0, done=0;
  s.blocks.forEach(function(b,bi){ b.exs.forEach(function(_,ei){ total++; if(cur.checks[bi+'-'+ei]) done++; }); });
  var pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('prog-fill').style.width = pct+'%';
  document.getElementById('prog-text').textContent = done+' of '+total+' done';
  if (done===total && total>0) document.getElementById('done-banner').classList.add('show');
}
</script>
</body>
</html>
