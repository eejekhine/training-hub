<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uni Study</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,550&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --ground:#f6f3ec; --surface:#ffffff; --line:#e2dbc8; --ink:#221d16; --ink-dim:#675e4c; --copper:#b8611f; }
  @media (prefers-color-scheme: dark){
    :root{ --ground:#14161b; --surface:#1a1d24; --line:#2c313a; --ink:#edeff2; --ink-dim:#9aa1ad; --copper:#dd9451; color-scheme:dark; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{max-width:420px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:36px 28px}
  h1{font-family:'Fraunces',serif;font-weight:550;font-size:1.5rem;margin:0 0 10px}
  p{color:var(--ink-dim);font-size:14px;line-height:1.6;margin:0}
  a{color:var(--copper);text-decoration:none;font-size:13px;display:inline-block;margin-top:18px}
</style>
</head>
<body>
  <div class="card">
    <h1>Uni Study — content not decided yet</h1>
    <p>This tile is a placeholder until you know what Leeds Beckett coursework support should actually contain. Say the word once you've got a specific module or topic in mind.</p>
    <a href="../index.html">← Back to Training Hub</a>
  </div>
</body>
</html>
